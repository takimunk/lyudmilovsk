; The graphics levels on iOS (docs/graphics.md): over the engine's BaseScalability.ini, its IOSScalability.ini and
; this project's DefaultScalability.ini. Phones get their level from the device profile (at most Epic). The project's
; changes for desktops that cost more than the engine's (shadows, distance field AO and screen-space reflections at Low,
; sharper textures at Low, High material quality and Epic detail at every level, light shafts at Medium, the desktop
; sea) go back to the engine's phone values here. Every key here is set at all five levels of its group by the engine
; or by this file (tools/check_scalability.py --platform IOS).

[ShadowQuality@0]
r.ShadowQuality=0

[GlobalIlluminationQuality@0]
r.DistanceFieldAO=0
r.AOQuality=0
r.SkylightIntensityMultiplier=0.8

[ReflectionQuality@0]
r.SSR.Quality=0

[TextureQuality@0]
r.Streaming.MipBias=16

[PostProcessQuality@1]
r.LightShaftQuality=0

; the sea by platform (-1: the phone's mesh and wave trains)
[EffectsQuality@0]
r.MaterialQualityLevel=0
r.DetailMode=0
lyud.Sea.Quality=-1

[EffectsQuality@1]
r.MaterialQualityLevel=2
r.DetailMode=1
lyud.Sea.Quality=-1

[EffectsQuality@2]
r.DetailMode=1
lyud.Sea.Quality=-1

[EffectsQuality@3]
lyud.Sea.Quality=-1

[EffectsQuality@Cine]
lyud.Sea.Quality=-1
