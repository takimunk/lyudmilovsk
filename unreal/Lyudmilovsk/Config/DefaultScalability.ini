r.Lumen.TranslucencyReflections.FrontLayer.Allow=0
r.Lumen.TranslucencyReflections.FrontLayer.Enable=0

; ---- Textures: the engine's Low drops every texture to its smallest mips (MipBias 16), faces and signs to mush.
; Low drops one mip like Medium; its smaller pool (the engine's 400 MB) drops more where memory runs short.
[TextureQuality@0]
r.Streaming.MipBias=1

; ---- Effects. The game's materials have no quality switches and no component has a detail mode, so the engine's lower
; material quality and detail mode would look the same here and only cost a stop when the level changes (every material's
; shaders cached again, every component sent to the renderer again: seconds of a frozen menu): High material quality and
; Epic detail at every level. The game's own: the clouds' ray-march samples (ALyudSky), the sea's mesh and wave trains
; (0 phone, 1 medium, 2 desktop; -1 the platform's own, desktop from High on), the fish's numbers and the motes in the
; water. Phones (Config/IOS, Config/Android) keep the engine's material quality and detail and their own sea.
[EffectsQuality@0]
r.MaterialQualityLevel=1
r.DetailMode=3
lyud.Sky.CloudSamples=0.5
lyud.Sea.Quality=0
lyud.SeaLife.Density=0.5
lyud.SeaLife.Motes=0

[EffectsQuality@1]
r.MaterialQualityLevel=1
r.DetailMode=3
lyud.Sky.CloudSamples=0.7
lyud.Sea.Quality=1
lyud.SeaLife.Density=0.75
lyud.SeaLife.Motes=1

[EffectsQuality@2]
r.DetailMode=3
lyud.Sky.CloudSamples=0.85
lyud.Sea.Quality=-1
lyud.SeaLife.Density=1
lyud.SeaLife.Motes=1

[EffectsQuality@3]
lyud.Sky.CloudSamples=1
lyud.Sea.Quality=-1
lyud.SeaLife.Density=1
lyud.SeaLife.Motes=1

[EffectsQuality@Cine]
lyud.Sky.CloudSamples=1
lyud.Sea.Quality=-1
lyud.SeaLife.Density=1
lyud.SeaLife.Motes=1

; ---- Post process: the sun's light shafts from Medium on (the engine's start at High; they cost little and the sun is
; much of what this game is about).
[PostProcessQuality@1]
r.LightShaftQuality=1

; ---- Foliage. The engine's group only scales its own foliage and grass, which this game has none of: these are the
; game's plants. GrassDensity: tufts of the grass patches (laid out again on a change). ForestFloor.Density: logs, moss,
; litter (cells laid out after the change take it). Plants.ShapeBudgetMs: game-thread time a frame the live plants spend
; growing into their shapes. The forests (AProceduralForest): MaxLive: fruit trees near the camera that become live plants (you pick
; from them; each takes tens of ms to build), -1 the forest's own (10). WindDistance: trees farther than this many metres
; stand still, so the virtual shadow map keeps their shadows cached instead of redrawing them every frame (0 wind
; everywhere). DistanceScale: x the forest's draw distance (500 m). Both distances are also x r.ViewDistanceScale (View
; distance): Low's wind reaches 30 m, Medium's 42, High's 64, Epic's 120. Shadows: the trees cast them.
[FoliageQuality@0]
lyud.GrassDensity=0.4
lyud.ForestFloor.Density=0.5
lyud.Plants.ShapeBudgetMs=1.5
lyud.Forest.MaxLive=3
lyud.Forest.WindDistance=75
lyud.Forest.DistanceScale=1
lyud.Forest.Shadows=1

