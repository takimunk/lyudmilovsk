; The graphics levels of Lyudmilovsk (docs/graphics.md): the engine's BaseScalability.ini with the changes below, so
; a level means the same thing to the menu's Graphics page, to `scalability N` / `sg.ShadowQuality N` in the console
; and to the benchmark (tools/bench.sh 0,1,2,3). The game's own lyud.* knobs sit in the groups they belong to.
;
; Scalability only sets the keys a level lists: a key one level sets and another does not keeps, at the other level,
; the value the level before left there. So every key set here at one level of a group is set at all five of them
; (@0 Low, @1 Medium, @2 High, @3 Epic, @Cine Cinematic) here or in BaseScalability.ini; tools/check_scalability.py
; checks that against the engine's file.
;
; The render resolution is not here: the game sets it from the anti-aliasing level and the window (LyudGraphics.cpp,
; Auto: Low 50%, Medium 58%, High 67%, Epic 75%, Cinematic 100% of a 1080p window, less in bigger windows).

; ---- View distance: LODs of static meshes (rocks, buildings, the forest's baked trees) come sooner below High; fewer
; birds, cats and dogs move as animated bodies near the camera (Bodies) and birds, people and animals are drawn less far
; (birds in their own lengths, the others in metres). r.ViewDistanceScale, the engine's 0.4 / 0.6 / 0.8 / 1 / 10, also
; scales every draw distance and the forest's wind distance (the game resends instanced meshes when it changes).
[ViewDistanceQuality@0]
r.StaticMeshLODDistanceScale=1.4
lyud.Birds.Bodies=4
lyud.Birds.DrawDistance=400
lyud.People.DrawDistance=80
lyud.Animals.Bodies=8
lyud.Animals.DrawDistance=60

[ViewDistanceQuality@1]
r.StaticMeshLODDistanceScale=1.2
lyud.Birds.Bodies=8
lyud.Birds.DrawDistance=550
lyud.People.DrawDistance=110
lyud.Animals.Bodies=12
lyud.Animals.DrawDistance=85

[ViewDistanceQuality@2]
r.StaticMeshLODDistanceScale=1
lyud.Birds.Bodies=12
lyud.Birds.DrawDistance=700
lyud.People.DrawDistance=150
lyud.Animals.Bodies=20
lyud.Animals.DrawDistance=110

[ViewDistanceQuality@3]
r.StaticMeshLODDistanceScale=1
lyud.Birds.Bodies=12
lyud.Birds.DrawDistance=700
lyud.People.DrawDistance=150
lyud.Animals.Bodies=20
lyud.Animals.DrawDistance=110

[ViewDistanceQuality@Cine]
r.StaticMeshLODDistanceScale=1
lyud.Birds.Bodies=12
lyud.Birds.DrawDistance=700
lyud.People.DrawDistance=150
lyud.Animals.Bodies=20
lyud.Animals.DrawDistance=110

; ---- Shadows: the engine's Low has none at all, which on this coast of long sun-lit evenings looks broken. Low keeps
; the sun's virtual shadow maps at half their resolution with hard edges, Medium at 70% with the engine's soft ones.
[ShadowQuality@0]
r.ShadowQuality=3
r.Shadow.Virtual.MaxPhysicalPages=1024
r.Shadow.Virtual.ResolutionLodBiasDirectional=1
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=1

[ShadowQuality@1]
r.Shadow.Virtual.MaxPhysicalPages=1024
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.5
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=0.5

; ---- Global illumination. Low: no Lumen, but distance field AO keeps the sky out of the rooms and from under the
; trees (the engine's Low lights every interior evenly by the sky). Medium is the engine's (Lumen's irradiance field).
[GlobalIlluminationQuality@0]
r.DistanceFieldAO=1
r.AOQuality=1
r.SkylightIntensityMultiplier=1.0

; Epic runs Lumen GI and reflections at the engine's High settings: ~20% of the frame for little visible change
; on this game's scenes (2026-10-31 optimization pass, docs/benchmark.md). Cinematic (@Cine) is the engine's.
[GlobalIlluminationQuality@3]
; When DFAO is enabled, Skylight intensity is normal
r.DistanceFieldAO=1
r.SkylightIntensityMultiplier=1.0
r.AOQuality=1
r.Lumen.DiffuseIndirect.Allow=1
; High GI: Lumen ScreenProbeGather for opaque diffuse GI downsampled 32x
r.Lumen.FinalGatherMethod=1
r.LumenScene.SurfaceCache.AtlasSize=3584
r.LumenScene.SurfaceCache.CardTexelDensityScale=100
r.LumenScene.SurfaceCache.CardMinResolution=4
r.LumenScene.SurfaceCache.CardMaxResolution=512
r.LumenScene.DirectLighting.MaxLightsPerTile=4
r.LumenScene.DirectLighting.UpdateFactor=64
r.LumenScene.Radiosity.UpdateFactor=128
r.LumenScene.Radiosity.ProbeSpacing=8
r.LumenScene.Radiosity.HemisphereProbeResolution=3
r.Lumen.TraceMeshSDFs.Allow=0
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
r.Lumen.ScreenProbeGather.RadianceCache.NumProbesToTraceBudget=100
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.ScreenProbeGather.NumAdaptiveProbes=16
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.ScreenProbeGather.IrradianceFormat=1
r.Lumen.ScreenProbeGather.StochasticInterpolation=1
r.Lumen.ScreenProbeGather.FullResolutionJitterWidth=1
r.Lumen.ScreenProbeGather.TwoSidedFoliageBackfaceDiffuse=0
r.Lumen.ScreenProbeGather.ScreenTraces.HZBTraversal.FullResDepth=1
r.Lumen.ScreenProbeGather.ShortRangeAO.DownsampleFactor=2
r.Lumen.ScreenProbeGather.ShortRangeAO.HorizonSearch.SliceCount=2
r.Lumen.ScreenProbeGather.ShortRangeAO.BentNormal=0
r.Lumen.ScreenProbeGather.ShortRangeAO.HorizonSearch.HZB=1
r.Lumen.ScreenProbeGather.ShortRangeAO.HorizonSearch.ForegroundSampleRejectPower=1.5
r.Lumen.ScreenProbeGather.ShortRangeAO.FoliageOcclusionStrength=.7
r.Lumen.TranslucencyVolume.GridPixelSize=64
r.Lumen.TranslucencyVolume.TraceFromVolume=0
r.Lumen.TranslucencyVolume.ShareRadianceCacheWithOpaque=0
r.Lumen.TranslucencyVolume.SpatialFilter=1
